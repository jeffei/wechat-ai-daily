name: Daily WeChat AI News

on:
  schedule:
    # 周一/三/五 08:00 CST (00:00 UTC): 大模型 AI Daily
    # 周日       08:00 CST (00:00 UTC): 具身智能周报
    - cron: '0 0 * * 0,1,3,5'
  workflow_dispatch: # Allows manual workflow execution anytime via GitHub Actions UI

permissions:
  contents: write

jobs:
  run-daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Chinese Fonts for Infographic
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei fonts-wqy-zenhei

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Test Article Formatting
        run: python -m unittest discover -s tests -v

      - name: Fetch AI News & Generate Article via Gemini 3.x
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }} # Optional, WeChat push notification key
        run: |
          python src/main.py

      - name: Commit and Push Updated Article & Summary Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/ index.html summary.png
          git diff --staged --quiet || (git commit -m "Auto-update AI news & summary card [$(date +'%Y-%m-%d %H:%M')]" && git push)